name: Lichess Bot Runner

# Запускает BotLi для аккаунта BeliberdoZavr на GitHub Actions.
# Перед запуском бота есть шаг Preflight: он проверяет токен и печатает
# аккаунт, статус BOT и список прав — если что-то не так, в логе будет
# понятная строка с ::error:: вместо молчаливого выхода с кодом 1.

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Команда для BotLi (пусто = matchmaking)'
        type: string
        required: false
        default: 'matchmaking'
  schedule:
    - cron: '0 */6 * * *'  # перезапуск каждые 6 часов
  push:
    branches: [ main ]
    paths:
      - '**.py'
      - 'config.yml'
      - '.github/workflows/run.yml'

concurrency:
  group: lichess-bot-runner
  cancel-in-progress: false

permissions:
  contents: write

env:
  BOT_USERNAME: BeliberdoZavr
  RUN_SECONDS: '19800'   # 5.5 часа, меньше лимита GitHub

jobs:
  bot-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache engines
        uses: actions/cache@v4
        with:
          path: engines
          key: engines-v3-${{ hashFiles('.github/workflows/run.yml') }}
          restore-keys: |
            engines-v3-

      - name: Setup Engines
        run: |
          set -euo pipefail
          mkdir -p engines
          if [ -x engines/stockfish ] && [ -x engines/atomic-stockfish ] \
             && [ -x engines/horde-stockfish ] && [ -x engines/fairy-stockfish ]; then
            echo "Движки взяты из кеша"
            ls -l engines
            exit 0
          fi

          # --- Stockfish: standard chess and chess960 ---
          # The binary is not stored in the repository, so fetch the official release
          # and take whatever x86-64 Linux asset the API advertises.
          api="https://api.github.com/repos/official-stockfish/Stockfish/releases/latest"
          url=$(curl -fsSL "$api" \
            | grep -oE '"browser_download_url": *"[^"]*stockfish-linux-x86-64[^"]*\.tar\.gz"' \
            | head -n1 | sed -E 's/.*"(https:[^"]+)"/\1/' || true)
          if [ -z "${url}" ]; then
            url="https://github.com/official-stockfish/Stockfish/releases/latest/download/stockfish-linux-x86-64-universal.tar.gz"
          fi
          echo "Stockfish: ${url}"
          curl -fsSL --retry 3 --retry-delay 2 -o /tmp/sf.tar "$url"
          rm -rf /tmp/sf-dist && mkdir -p /tmp/sf-dist
          tar -xf /tmp/sf.tar -C /tmp/sf-dist
          binary=$(find /tmp/sf-dist -type f -size +1M -name 'stockfish*' | head -n1)
          test -n "${binary}"
          install -m 755 "${binary}" engines/stockfish
          find /tmp/sf-dist -name '*.nnue' -exec cp {} engines/ \; 2>/dev/null || true
          printf 'uci\nquit\n' | ./engines/stockfish | grep -m1 'id name'

          # --- Atomic-Stockfish: needed for the atomic variant ---
          base="https://github.com/Belzedar94/Atomic-Stockfish/releases/download/rolling-main"
          for build in atomic-stockfish-linux-x86-64-bmi2 atomic-stockfish-linux-x86-64-avx2 atomic-stockfish-linux-x86-64-sse41-popcnt; do
            echo "Trying ${build}"
            if ! curl -fsSL --retry 3 --retry-delay 2 -o engines/atomic-stockfish "${base}/${build}"; then
              echo "::warning::download failed for ${build}"
              continue
            fi
            chmod +x engines/atomic-stockfish
            if printf 'uci\nquit\n' | ./engines/atomic-stockfish > /tmp/atomic-uci.txt 2>/dev/null \
               && grep -q 'UCI_Variant' /tmp/atomic-uci.txt; then
              grep -m1 'id name' /tmp/atomic-uci.txt
              echo "Using ${build}"
              break
            fi
            echo "::warning::${build} does not run here"
            rm -f engines/atomic-stockfish
          done
          # Fail before a game starts rather than in the middle of an atomic game.
          test -x engines/atomic-stockfish
          grep -q 'UCI_Variant' /tmp/atomic-uci.txt

          # --- Horde-Stockfish: needed for the horde variant ---
          base="https://github.com/Belzedar94/Horde-Stockfish/releases/download/v1.0.0"
          installed=""
          for build in Horde-Stockfish-1.0.0-linux-x86-64-bmi2 Horde-Stockfish-1.0.0-linux-x86-64-avx2; do
            echo "Trying ${build}"
            if ! curl -fsSL --retry 3 --retry-delay 2 -o /tmp/horde.tar.xz "${base}/${build}.tar.xz"; then
              echo "::warning::download failed for ${build}"
              continue
            fi
            rm -rf /tmp/horde-dist && mkdir -p /tmp/horde-dist
            tar -xf /tmp/horde.tar.xz -C /tmp/horde-dist
            binary=$(find /tmp/horde-dist -type f -name 'horde-stockfish' | head -n1)
            test -n "${binary}" || continue
            install -m 755 "${binary}" engines/horde-stockfish || continue
            printf 'uci\nquit\n' | ./engines/horde-stockfish > /tmp/horde-uci.txt 2>&1 || true
            if grep -q 'UCI_Variant' /tmp/horde-uci.txt; then
              grep -m1 'id name' /tmp/horde-uci.txt
              echo "Using ${build}"
              installed="yes"
              break
            fi
            echo "::warning::${build} does not run here"
            rm -f engines/horde-stockfish
          done
          if [ -z "${installed}" ]; then
            echo "::error::Horde-Stockfish could not run on this runner, but it is configured in config.yml."
            exit 1
          fi

          ls -l engines

      - name: Download Fairy-Stockfish
        run: |
          set -uo pipefail
          if [ -x engines/fairy-stockfish ]; then
            echo "Fairy-Stockfish уже есть"
            exit 0
          fi
          # Fairy-Stockfish — движок для вариантов без своей специализации
          # (racing kings, fromPosition и любой другой, что появится в конфиге).
          base="https://github.com/fairy-stockfish/Fairy-Stockfish/releases/download/fairy_sf_14"
          for build in fairy-stockfish-largeboard_x86-64-bmi2 fairy-stockfish-largeboard_x86-64; do
            echo "Trying ${build}"
            if ! curl -fsSL --retry 3 --retry-delay 2 -o engines/fairy-stockfish "${base}/${build}"; then
              echo "::warning::download failed for ${build}"
              continue
            fi
            chmod +x engines/fairy-stockfish
            if printf 'uci\nquit\n' | ./engines/fairy-stockfish > /tmp/fairy-uci.txt 2>/dev/null \
               && grep -q 'var racingkings' /tmp/fairy-uci.txt; then
              grep -m1 'id name' /tmp/fairy-uci.txt
              echo "Using ${build}"
              break
            fi
            echo "::warning::${build} does not run here"
            rm -f engines/fairy-stockfish
          done
          if [ ! -x engines/fairy-stockfish ]; then
            echo "::warning::Fairy-Stockfish недоступен, варианты без своего движка будут отключены."
          fi

      - name: Build variant engines
        run: |
          set -uo pipefail
          set +e   # сборка любого движка — best effort, иначе bash -e уронит шаг
          # Специализированные движки под отдельные варианты. У них нет релизов,
          # поэтому собираем из исходников; неудачная сборка не валит job —
          # соответствующий вариант просто выключится на шаге Adapt config.
          build_one() {
            repo="$1"; out="$2"; variant="$3"
            if [ -x "engines/${out}" ]; then
              echo "${out}: уже есть"
              return 0
            fi
            echo "=== Собираю ${repo} ==="
            rm -rf "/tmp/build-${out}"
            if ! git clone --depth 1 "https://github.com/Belzedar94/${repo}.git" "/tmp/build-${out}" > /dev/null 2>&1; then
              echo "::warning::не удалось склонировать ${repo}"
              return 1
            fi
            if ! make -C "/tmp/build-${out}/src" -j"$(nproc)" build ARCH=x86-64-avx2 > "/tmp/${out}-build.log" 2>&1; then
              echo "::warning::сборка ${repo} не удалась"
              tail -n 15 "/tmp/${out}-build.log"
              return 1
            fi
            bin=$(find "/tmp/build-${out}" -type f -perm -u+x -size +300k \
                    \( -name 'stockfish*' -o -name '*-stockfish' -o -name 'fsf*' \) | head -n1)
            if [ -z "${bin}" ]; then
              # Имя может быть любым — берём самый крупный исполняемый файл в src.
              bin=$(find "/tmp/build-${out}/src" -maxdepth 1 -type f -perm -u+x -size +300k \
                      -exec ls -S {} + 2>/dev/null | head -n1)
            fi
            if [ -z "${bin}" ]; then
              echo "::warning::бинарник ${repo} не найден"
              ls -l "/tmp/build-${out}/src" | head -n 20
              return 1
            fi
            install -m 755 "${bin}" "engines/${out}"
            if printf 'uci\nquit\n' | "./engines/${out}" > "/tmp/${out}-uci.txt" 2>/dev/null \
               && grep -qi "var ${variant}" "/tmp/${out}-uci.txt"; then
              grep -m1 'id name' "/tmp/${out}-uci.txt"
              return 0
            fi
            echo "::warning::${out} не поддерживает вариант ${variant}"
            rm -f "engines/${out}"
            return 1
          }

          build_one 3Check-Stockfish     threecheck-stockfish   3check      || true
          build_one KOTH-Stockfish       koth-stockfish         kingofthehill || true
          build_one Antichess-Stockfish  antichess-stockfish    antichess  || true
          build_one Crazyhouse-Stockfish crazyhouse-stockfish  crazyhouse  || true

          echo "--- итог ---"
          ls -l engines

      - name: Adapt config to available engines
        run: |
          python3 << 'EOF'
          import os, yaml

          ENGINES = {
              "atomic": "engines/atomic-stockfish",
              "horde": "engines/horde-stockfish",
              "antichess": "engines/antichess-stockfish",
              "crazyhouse": "engines/crazyhouse-stockfish",
              "threecheck": "engines/threecheck-stockfish",
              "kingofthehill": "engines/koth-stockfish",
              "racingkings": "engines/fairy-stockfish",
              "variants": "engines/fairy-stockfish",
          }
          VARIANT_TO_ENGINE = {
              "atomic": "atomic",
              "horde": "horde",
              "antichess": "antichess",
              "crazyhouse": "crazyhouse",
              "threeCheck": "threecheck",
              "kingOfTheHill": "kingofthehill",
              "racingKings": "racingkings",
          }

          cfg = yaml.safe_load(open("config.yml", encoding="utf-8"))
          engines = cfg["engines"]
          dropped = [k for k, path in ENGINES.items() if k in engines and not os.path.exists(path)]
          for key in dropped:
              engines.pop(key, None)

          variants = []
          for v in cfg["challenge"]["variants"]:
              if v in ("standard", "chess960") or VARIANT_TO_ENGINE.get(v, v) in engines:
                  variants.append(v)
          cfg["challenge"]["variants"] = variants

          with open("config.yml", "w", encoding="utf-8") as f:
              yaml.dump(cfg, f, default_flow_style=False, allow_unicode=True)

          print("движки:", ", ".join(sorted(engines)))
          print("варианты:", ", ".join(variants))
          if dropped:
              print("::warning::движки недоступны, отключены:", ", ".join(dropped))
          EOF

      - name: Inject Lichess Bot Token
        env:
          LICHESS_TOKEN: ${{ secrets.LICHESS_TOKEN }}
        run: |
          python3 << 'EOF'
          import os, sys, yaml
          token = (os.environ.get("LICHESS_TOKEN") or "").strip()
          if not token:
              print("::error::Секрет LICHESS_TOKEN пуст. Settings -> Secrets and variables -> Actions")
              sys.exit(1)
          with open("config.yml", "r") as f:
              config = yaml.safe_load(f) or {}
          config["token"] = token
          with open("config.yml", "w") as f:
              yaml.dump(config, f, default_flow_style=False)
          print("Токен подставлен в config.yml")
          EOF

      - name: Preflight - validate token
        env:
          LICHESS_TOKEN: ${{ secrets.LICHESS_TOKEN }}
        run: |
          python3 << 'EOF'
          import json, os, sys, urllib.request
          token = (os.environ.get("LICHESS_TOKEN") or "").strip()
          if not token:
              print("::error::Секрет LICHESS_TOKEN пуст")
              sys.exit(1)

          # Права токена читаем ровно так, как это делает сам BotLi:
          # POST /api/token/test. Поле scopes в /api/account пустое,
          # опираться на него нельзя.
          test_req = urllib.request.Request(
              "https://lichess.org/api/token/test",
              data=token.encode(),
              headers={"Content-Type": "text/plain"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(test_req, timeout=30) as r:
                  info = json.load(r).get(token)
          except Exception as e:
              print(f"::error::Не удалось проверить токен: {e}")
              sys.exit(1)

          if not info:
              print("::error::Lichess считает токен недействительным (token/test вернул null). Создайте новый.")
              sys.exit(1)

          scopes = info.get("scopes") or ""
          print(f'token userId={info.get("userId")} scopes=[{scopes}]')

          if "bot:play" not in scopes:
              print("::error::У токена нет права bot:play. Создайте новый: https://lichess.org/account/oauth/token/create?scopes[]=bot:play&description=BotLi")
              sys.exit(1)

          acc_req = urllib.request.Request(
              "https://lichess.org/api/account",
              headers={"Authorization": f"Bearer {token}"},
          )
          try:
              with urllib.request.urlopen(acc_req, timeout=30) as r:
                  acc = json.load(r)
          except Exception as e:
              print(f"::error::Lichess отклонил токен: {e}")
              sys.exit(1)

          print(f'account={acc.get("username")} title={acc.get("title")}')
          if acc.get("title") != "BOT":
              print("::error::Аккаунт не переведён в BOT. Сначала запустите BotLi с флагом --upgrade.")
              sys.exit(1)

          print("Preflight OK")
          EOF

      - name: Run Bot
        run: |
          CMD="${{ inputs.command }}"
          if [ -z "$CMD" ]; then CMD="matchmaking"; fi
          echo "Команда BotLi: $CMD"
          set +e
          timeout --signal=TERM --kill-after=60 "$RUN_SECONDS" python3 -u user_interface.py "$CMD"
          RC=$?
          set -e
          if [ "$RC" -eq 124 ] || [ "$RC" -eq 143 ]; then
            echo "Бот отработал запланированные 5.5 часа и остановлен (rc=$RC)"
            exit 0
          fi
          echo "::error::Бот завершился с кодом $RC"
          exit "$RC"

      - name: Learn from the games
        if: always()
        continue-on-error: true
        run: |
          python3 learn_mistakes.py \
            --book mistakes.json \
            --config config.yml \
            --username "$BOT_USERNAME" \
            --depth 12 --threshold 150 --max-games 40

      - name: Commit the remembered mistakes
        if: always()
        continue-on-error: true
        run: |
          if [ ! -f mistakes.json ]; then
            echo "No mistake book to commit."
            exit 0
          fi
          git config user.name "botli-bot"
          git config user.email "botli-bot@users.noreply.github.com"
          git add mistakes.json
          if git diff --cached --quiet; then
            echo "No new mistakes this session."
            exit 0
          fi
          git commit -m "Remember new mistakes"
          git push origin HEAD:main

      - name: Upload game records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-records-${{ github.run_number }}
          path: game_records/
          retention-days: 7
          if-no-files-found: ignore
